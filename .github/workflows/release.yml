name: Release Proctor

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      has_python_package: ${{ steps.python_package.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semver tag against package.json
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"
          echo "Releasing @genramzi/proctor@$package_version"

      - name: Detect optional Python package
        id: python_package
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Python package detected; PyPI job will publish it."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml found; PyPI job will be skipped."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish_npm:
    name: Publish package to npm
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish @genramzi/proctor
        run: npm publish

  build_python:
    name: Build optional Python distributions
    needs: validate
    if: needs.validate.outputs.has_python_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-release-dists
          path: dist/
          if-no-files-found: error

  publish_pypi:
    name: Publish optional package to PyPI
    needs: build_python
    if: needs.build_python.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-release-dists
          path: dist/

      - name: Publish distributions to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs:
      - validate
      - publish_npm
      - publish_pypi
    if: >-
      always() &&
      needs.publish_npm.result == 'success' &&
      (needs.publish_pypi.result == 'success' || needs.publish_pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies and build npm asset
        run: |
          npm ci
          npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --pack-destination release-assets

      - name: Download Python distributions when available
        if: needs.publish_pypi.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: python-release-dists
          path: release-assets/python

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: find release-assets -type f -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME"
